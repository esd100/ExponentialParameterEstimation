[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mexp"
version = "0.0.1"
description = "Phase 0 benchmark harness for multi-exponential MR parameter estimation (pluggable kernels)."
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Eric Diaz", email = "eric.diaz@gmail.com"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7", "mpmath>=1.3"]

[tool.setuptools.packages.find]
include = ["mexp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
